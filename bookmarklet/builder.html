<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>북마크릿 생성기</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 32px 20px;
    background: #f1f5f9;
    color: #0f172a;
    display: flex;
    justify-content: center;
  }
  .wrap { width: 100%; max-width: 720px; }
  .card {
    background: #ffffff;
    border-radius: 14px;
    box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
    border: 1px solid #e2e8f0;
    padding: 24px;
    margin-bottom: 20px;
  }
  h1 { font-size: 20px; margin: 0 0 6px; }
  .subtitle { font-size: 13px; color: #64748b; margin: 0 0 20px; line-height: 1.6; }
  label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px; }
  textarea {
    width: 100%;
    min-height: 220px;
    box-sizing: border-box;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    resize: vertical;
    background: #f8fafc;
    color: #0f172a;
  }
  textarea#output { min-height: 120px; }
  button {
    -webkit-appearance: none;
    appearance: none;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s ease;
  }
  .btn-primary { background: #2563eb; color: #fff; }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-secondary { background: #fff; color: #334155; border: 1px solid #cbd5e1; }
  .btn-secondary:hover { background: #f8fafc; }
  .actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .result { margin-top: 22px; display: none; }
  .result.visible { display: block; }
  .meta { font-size: 12px; color: #64748b; margin: 10px 0; }
  .meta.warn { color: #b45309; }
  .drag-link {
    display: inline-block;
    background: #eef2ff;
    color: #3730a3;
    border: 1px dashed #a5b4fc;
    border-radius: 10px;
    padding: 12px 18px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    cursor: grab;
    margin-bottom: 14px;
  }
  .drag-link:hover { background: #e0e7ff; }
  .hint { font-size: 12px; color: #64748b; margin: -6px 0 14px; }
  @media (prefers-color-scheme: dark) {
    body { background: #0b1220; color: #e2e8f0; }
    .card { background: #111827; border-color: #1f2937; }
    .subtitle, .meta, .hint { color: #94a3b8; }
    label { color: #cbd5e1; }
    textarea { background: #0b1220; color: #e2e8f0; border-color: #334155; }
    .btn-secondary { background: #111827; color: #e2e8f0; border-color: #334155; }
    .btn-secondary:hover { background: #1a2333; }
    .drag-link { background: #1e1b4b; color: #c7d2fe; border-color: #4338ca; }
    .drag-link:hover { background: #26235c; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>북마크릿 생성기</h1>
    <p class="subtitle">Node.js 없이 브라우저에서만 동작합니다. 아래에 원본 JS 코드(예: bookmarklet/src/bookmarklet.js 내용)를 붙여넣고 "생성하기"를 누르면 북마크릿용 <code>javascript:</code> 링크를 만들어줍니다.</p>

    <label for="input">원본 JS 코드</label>
    <textarea id="input" placeholder="여기에 bookmarklet.js 전체 내용을 붙여넣으세요"></textarea>

    <div class="actions">
      <button id="buildBtn" class="btn-primary">⚙️ 생성하기</button>
      <button id="clearBtn" class="btn-secondary">지우기</button>
    </div>

    <div id="result" class="result">
      <div class="meta" id="lengthInfo"></div>
      <a id="dragLink" class="drag-link" href="javascript:void(0)">🔖 이 링크를 북마크바로 드래그하세요</a>
      <div class="hint">(드래그가 안 되면 아래 텍스트를 전체 복사해서 새 북마크의 URL 칸에 붙여넣으세요)</div>
      <label for="output">생성된 javascript: 링크</label>
      <textarea id="output" readonly></textarea>
      <div class="actions">
        <button id="copyBtn" class="btn-primary">📋 복사</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  function stripComments(source) {
    var lines = source.split('\n');
    var out = [];
    var inBlockComment = false;
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      var trimmed = line.trim();
      if (inBlockComment) {
        var endIdx = trimmed.indexOf('*/');
        if (endIdx !== -1) {
          inBlockComment = false;
          var rest = trimmed.slice(endIdx + 2).trim();
          if (rest !== '') out.push(rest);
        }
        continue;
      }
      if (trimmed.indexOf('/*') === 0) {
        var closeIdx = trimmed.indexOf('*/', 2);
        if (closeIdx !== -1) {
          var afterBlock = trimmed.slice(closeIdx + 2).trim();
          if (afterBlock !== '') out.push(afterBlock);
        } else {
          inBlockComment = true;
        }
        continue;
      }
      if (trimmed.indexOf('//') === 0) continue;
      if (trimmed === '') continue;
      out.push(trimmed);
    }
    return out.join('\n');
  }

  var input = document.getElementById('input');
  var output = document.getElementById('output');
  var result = document.getElementById('result');
  var lengthInfo = document.getElementById('lengthInfo');
  var dragLink = document.getElementById('dragLink');

  document.getElementById('buildBtn').addEventListener('click', function () {
    var source = input.value;
    if (!source.trim()) {
      alert('원본 JS 코드를 붙여넣어 주세요.');
      return;
    }
    var stripped = stripComments(source);
    var uri = 'javascript:' + encodeURIComponent(stripped);

    output.value = uri;
    dragLink.setAttribute('href', uri);

    var warn = uri.length > 60000;
    lengthInfo.textContent = '길이: ' + uri.length.toLocaleString() + '자' +
      (warn ? ' — 매우 깁니다. 일부 브라우저에서 북마크 URL 길이 제한에 걸릴 수 있습니다.' : '');
    lengthInfo.className = 'meta' + (warn ? ' warn' : '');

    result.classList.add('visible');
  });

  document.getElementById('clearBtn').addEventListener('click', function () {
    input.value = '';
    output.value = '';
    result.classList.remove('visible');
  });

  document.getElementById('copyBtn').addEventListener('click', function () {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(output.value).then(function () {
        alert('복사되었습니다.');
      }, function () {
        output.focus();
        output.select();
        alert('클립보드 복사에 실패했습니다. 텍스트가 선택되어 있으니 Ctrl+C로 복사하세요.');
      });
    } else {
      output.focus();
      output.select();
      alert('이 브라우저는 자동 복사를 지원하지 않습니다. 텍스트가 선택되어 있으니 Ctrl+C로 복사하세요.');
    }
  });
})();
</script>
</body>
</html>
